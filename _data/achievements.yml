# Achievement Badges Configuration
# This file defines all achievement badges displayed on the portfolio

categories:
  - name: "Open Source Contributions"
    id: "open-source"
    icon: "fab fa-github"
    description: "Recognized contributions to open source projects and communities"
    badges:
      - name: "Open edX Core Contributor"
        icon: "/assets/img/openedx-core-contributor-badge.svg"
        description: "Recognized Core Contributor and Open Source Maintainer in the Open edX ecosystem, running platform-wide upgrades across 150+ repositories"
        url: "https://openedx.org/"

      - name: "Open edX Working Group Member"
        icon: "https://logos.openedx.org/open-edx-logo-tag.png"
        description: "Active member of the Open edX Maintenance Working Group and the edx-platform Working Group"
        url: "https://openedx.org/"

      - name: "Pressingly FOSS Contributor"
        icon: "https://avatars.githubusercontent.com/u/112745038?s=200&v=4"
        description: "Built mpass-auth-proxy and contributed MCP server implementations across the Pressingly FOSS bundle (Twenty, Plane, Outline, Penpot, SurfSense)"
        url: "https://github.com/Pressingly"

  - name: "Leadership and Speaking"
    id: "community"
    icon: "fas fa-microphone-alt"
    description: "Community leadership and public speaking engagements"
    badges:
      - name: "Open edX Conference 2024 Speaker"
        icon: "https://logos.openedx.org/open-edx-logo-tag.png"
        description: "Presented the Repo Health Dashboard at Open edX Conference 2024, sharing tooling and best practices for ecosystem-wide modernization"
        url: "https://openedx.org/conference/"

      - name: "Open edX Working Group Participant"
        icon: "https://logos.openedx.org/open-edx-logo-tag.png"
        description: "Active contributor to Open edX governance and process standardization across the Maintenance and edx-platform working groups"
        url: "https://openedx.org/"

  - name: "Mentorship"
    id: "mentorship"
    icon: "fas fa-people-group"
    description: "Internal mentorship program contributions"
    badges:
      - name: "Engineering Mentor"
        icon: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        description: "Coached five engineers to independent delivery as part of Arbisoft's internal mentorship program, building succession depth across the team and company"
        url: "https://www.arbisoft.com/"

  - name: "Certifications"
    id: "certifications"
    icon: "fas fa-certificate"
    description: "Professional certifications and technical qualifications"
    badges:
      # Add earned certifications here. When you get the badge, uncomment and update the URL.
      # - name: "AWS Solutions Architect Associate"
      #   icon: "https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg"
      #   description: "Amazon Web Services certified solutions architect"
      #   url: "https://aws.amazon.com/certification/"

# Badge display settings
settings:
  # Number of badges to show per row on desktop
  badges_per_row: 3

  # Show skills tags on badges
  show_skills: true

  # Enable hover animations
  enable_animations: true

  # Show dates on badges
  show_dates: true
